services:
  backend:
    build:
      context: ./backend

    container_name: adaptive_backend

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      ML_URL: http://ml:5001/predict

    depends_on:
      - ml

  ml:
    build:
      context: ./ml

    container_name: adaptive_ml

    ports:
      - "5001:5001"

  frontend:
    build:
      context: ./frontend

    container_name: adaptive_frontend

    ports:
      - "5173:5173"

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - backend